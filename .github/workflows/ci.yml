name: CI
on:
  push:
    branches: [main]
  pull_request:

# um push novo cancela a verificação anterior que ainda esteja a correr
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-de-dados:
    name: Base de dados (migrações + testes)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Testes SQL
        run: bash tests/db/run.sh

  importacao:
    name: Importação de tabelas de fornecedores
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.4
      - name: Testes do extrator
        run: python -m unittest discover -s tools/import -p "test_*.py" -v
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Testes do leitor de folhas (backoffice)
        run: node --experimental-strip-types --no-warnings --test tests/import-js/importer.test.ts

  loja:
    name: Loja (tipos + compilação)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tipos
        run: |
          npx tsc --noEmit --pretty false > /tmp/tsc.txt 2>&1 && exit 0
          # erros como anotações (file/line), legíveis pela API do GitHub
          sed -E 's#^([^(]+)\(([0-9]+),([0-9]+)\): (.*)$#::error file=web/\1,line=\2,col=\3::\1:\2 \4#' /tmp/tsc.txt | head -40
          exit 1
      - name: Compilação
        run: |
          npm run build > /tmp/build.txt 2>&1 && { tail -40 /tmp/build.txt; exit 0; }
          grep -iE "error|failed|Type error" -A3 /tmp/build.txt | head -30 | sed 's/^/::error::/'
          tail -60 /tmp/build.txt
          exit 1

  backoffice:
    name: Backoffice (percurso no browser)
    needs: loja
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_SUPABASE_KEY: chave-de-teste
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Base de dados de teste
        run: bash tests/e2e/seed.sh
      - name: PostgREST + Supabase simulado
        run: |
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ -C /tmp
          printf 'db-uri = "postgres://authenticator:x@localhost:5432/e2e"\ndb-schemas = "public"\ndb-anon-role = "anon"\njwt-secret = "local-test-secret-local-test-secret-123456"\nserver-port = 3001\nserver-host = "127.0.0.1"\n' > /tmp/pgrst.conf
          nohup /tmp/postgrest /tmp/pgrst.conf > /tmp/pgrst.log 2>&1 &
          PSQL="psql -d e2e" nohup node tests/e2e/mock-supabase.mjs > /tmp/mock.log 2>&1 &
          sleep 3; cat /tmp/pgrst.log /tmp/mock.log
      - name: Compilar e arrancar a loja
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          if ! npm run build > /tmp/build.txt 2>&1; then
            grep -iE "error|failed" -A3 /tmp/build.txt | head -30 | sed 's/^/::error::/'
            tail -40 /tmp/build.txt; exit 1
          fi
          nohup npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/admin > /dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Percurso no backoffice
        working-directory: tests/e2e
        run: SHOTS=$RUNNER_TEMP/shots node admin.mjs
      - name: Publicar fotografias (ramo e2e-shots)
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/shots" ] || exit 0
          cd "$RUNNER_TEMP/shots"
          cp /tmp/next.log /tmp/mock.log /tmp/pgrst.log . 2>/dev/null || true
          # o Vercel olha para a pasta "web" de cada ramo: este ramo diz-lhe para não publicar nada
          mkdir -p web && printf '{"git":{"deploymentEnabled":false}}\n' > web/vercel.json
          git init -q -b e2e-shots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "fotografias ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" e2e-shots || echo "::warning::não foi possível publicar as fotografias"
