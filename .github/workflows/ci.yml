name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  base-de-dados:
    name: Base de dados (migrações + testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Testes SQL
        run: bash tests/db/run.sh

  importacao:
    name: Importação de tabelas de fornecedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.4
      - name: Testes do extrator
        run: python -m unittest discover -s tools/import -p "test_*.py" -v
